# ============================================================
# RAG via Ollama - application configuration
# Every key can be overridden with an environment variable,
# e.g. "ollama.url" -> OLLAMA_URL, "chunk.size.chars" -> CHUNK_SIZE_CHARS
# ============================================================

# --- Ollama server ---
ollama.url=http://localhost:11434
# Generation model (works out of the box with a plain `ollama pull llama3.2:1b`)
ollama.model=llama3.2:1b
# Server response timeout for non-streaming calls (seconds)
ollama.timeout.seconds=60

# --- Embeddings ---
# tfidf  : built-in lexical TF-IDF vector space, zero extra downloads (default)
# ollama : semantic embeddings via the Ollama /api/embed endpoint
#          (requires an Ollama server started with embeddings enabled and
#           an embedding model, e.g. `ollama pull nomic-embed-text`)
embedding.provider=tfidf
# Model used only when embedding.provider=ollama
embedding.model=nomic-embed-text

# --- Document chunking ---
chunk.size.chars=700
chunk.overlap.chars=120

# --- Retrieval ---
retrieval.topk=3
retrieval.min.score=0.05

# --- Generation ---
generation.temperature=0.2
generation.num.predict=512

# --- Web UI ---
web.port=8080
