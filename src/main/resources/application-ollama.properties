# --- Semantic embedding profile (nomic-embed-text) -------------------
# Activate with:  java -jar rag-via-ollama.jar --spring.profiles.active=ollama
# Requires Ollama started with --embeddings and the model pulled:
#   ollama serve --embeddings && ollama pull nomic-embed-text
# The absolute floor differs from the TF-IDF default because
# nomic-embed-text scores even unrelated text around 0.7 relevance
# (measured on the bundled corpus: unrelated 0.71-0.77, on-topic 0.775-0.85).

rag.embedding.provider=ollama
rag.retrieval.min-score=0.77
