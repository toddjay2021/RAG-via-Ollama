# ============================================================
# RAG via Ollama - application configuration (Spring Boot)
# Every value can be overridden with environment variables
# (RAG_OLLAMA_MODEL, RAG_EMBEDDING_PROVIDER, ...) or command-line
# flags (--rag.retrieval.top-k=5).
# ============================================================

spring.application.name=rag-via-ollama
server.port=8080

# --- Ollama server -------------------------------------------------
rag.ollama.base-url=http://localhost:11434
# Generation model (works out of the box with `ollama pull llama3.2:1b`)
rag.ollama.model=llama3.2:1b
# Embedding model, used only when rag.embedding.provider=ollama
rag.ollama.embedding-model=nomic-embed-text
rag.ollama.timeout=60s

# --- Embeddings ----------------------------------------------------
# tfidf  : built-in lexical TF-IDF vector space, zero extra downloads (default)
# ollama : semantic embeddings via Ollama /api/embed
#          (requires `ollama serve --embeddings` + an embedding model)
rag.embedding.provider=tfidf

# --- Optional external knowledge-base folder (.md / .txt) -----------
# Leave empty to use the bundled classpath:/docs corpus.
rag.docs.path=

# --- Chunking ------------------------------------------------------
rag.chunking.size=700
rag.chunking.overlap=120

# --- Retrieval -----------------------------------------------------
rag.retrieval.top-k=3
rag.retrieval.min-score=0.05

# --- Generation ----------------------------------------------------
rag.generation.temperature=0.2
rag.generation.num-predict=512
